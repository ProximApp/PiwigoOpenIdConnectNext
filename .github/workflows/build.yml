name: Build
on:
  pull_request:
    types: [opened, edited, ready_for_review, synchronize]
  push:
    branches:
      - main
  release:
    types: [published]

# Read only, except for the release job
permissions:
  contents: read

jobs:
  # Pull requests and main: build the plugin and keep it as an artifact
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest provides git, php, composer and zip
      - name: Build
        run: sh build-release.sh

      # The artifact contains the OpenIdConnect/ directory, ready to be
      # unzipped in the plugins/ directory of Piwigo
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIdConnect
          path: |
            build/
            !build/OpenIdConnect.zip

  # Published release: build the plugin and attach the zip to the release
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload of the zip to the release

    steps:
      - uses: actions/checkout@v5

      # The release tag (v2.1.0 or 2.1.0) must match the Version: header of
      # main.inc.php, displayed by Piwigo and the extension library
      - name: Check the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's/^Version: *//p' main.inc.php | tr -d '\r')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match the version of main.inc.php ($VERSION)"
            exit 1
          fi

      - name: Build
        run: sh build-release.sh

      # Attached as OpenIdConnect.zip, so that the last release is always at
      # releases/latest/download/OpenIdConnect.zip
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/OpenIdConnect.zip --clobber
