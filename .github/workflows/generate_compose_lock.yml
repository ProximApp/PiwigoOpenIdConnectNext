name: Build release
on:
  pull_request:
    types: [opened, edited, ready_for_review, synchronize]
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest provides git, php, composer and zip
      - name: Build
        run: NO_ZIP=1 sh build-release.sh

      # The artifact zip contains the OpenIdConnect/ directory, ready to be
      # unzipped in the plugins/ directory of Piwigo
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIdConnect
          path: build/
